; ESP32-S3-DevKitC-1 N16R8 — голосовой ассистент «Вегас»
;
;   микрофон:   INMP441, I2S_NUM_0
;   динамик:    MAX98357A, I2S_NUM_1
;   ассистент:  WebSocket -> voice_server.py (Sherpa/Vosk + LLM + Piper)
;   активация:  кнопка BOOT (GPIO0)
;
; Перед сборкой скопируй include/secrets.example.h в include/secrets.h
; и заполни Wi-Fi, SERVER_HOST и OTA_PASSWORD.

[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16 МБ flash, flash_mode=dio обязателен для этой платы.
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    ; Serial -> UART0 (GPIO43/44), чтобы читать лог через UART-порт CH343.
    ; Для лога через native USB поставить 1.
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit NeoPixel@^1.11.0

; OTA-обновление по Wi-Fi (ArduinoOTA/espota).
; Перед запуском задай адрес и пароль в окружении:
;   export OTA_HOST=192.168.1.100
;   export OTA_PASSWORD=your-ota-password
;   ~/.platformio/penv/bin/pio run -e esp32-s3-ota -t upload
[env:esp32-s3-ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = ${sysenv.OTA_HOST}
upload_flags = --auth=${sysenv.OTA_PASSWORD}
